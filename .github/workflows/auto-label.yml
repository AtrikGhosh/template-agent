name: Auto Label

on:
  pull_request_target:
    branches: [main, deep-agent]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label-pr:
    name: Label PR
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label by PR title convention
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const labels = [];

            if (title.startsWith('feat'))     labels.push('feature');
            if (title.startsWith('fix'))      labels.push('bug');
            if (title.startsWith('docs'))     labels.push('documentation');
            if (title.startsWith('chore'))    labels.push('chore');
            if (title.startsWith('refactor')) labels.push('refactor');
            if (title.startsWith('test'))     labels.push('testing');
            if (title.startsWith('ci'))       labels.push('ci');
            if (title.startsWith('perf'))     labels.push('performance');
            if (title.includes('!:'))         labels.push('breaking-change');

            const size = context.payload.pull_request.changed_files;
            if (size <= 5)        labels.push('size/S');
            else if (size <= 15)  labels.push('size/M');
            else if (size <= 30)  labels.push('size/L');
            else                  labels.push('size/XL');

            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: labels,
                });
              } catch (e) {
                core.warning(`Could not add labels (org may restrict write permissions for fork PRs): ${e.message}`);
              }
            }

            const author = context.payload.pull_request.user.login;
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                assignees: [author],
              });
            } catch (e) {
              core.warning(`Could not assign author (org may restrict write permissions): ${e.message}`);
            }
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                team_reviewers: ['template-agent-maintainers'],
              });
            } catch (e) {
              core.warning(`Could not request reviewers (org may restrict write permissions): ${e.message}`);
            }

  check-issue-link:
    name: Check Issue Link
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for linked issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;

            // Use the timeline API to find issues linked via the Development sidebar
            // (closing references like "Fixes #N" or manual links)
            const timeline = await github.paginate(
              github.rest.issues.listEventsForTimeline,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );

            const linkedIssueNumbers = [];
            for (const event of timeline) {
              if (event.event === 'cross-referenced' && event.source?.issue) {
                const src = event.source.issue;
                if (!src.pull_request && src.repository?.full_name === `${owner}/${repo}`) {
                  linkedIssueNumbers.push(src.number);
                }
              }
              if (event.event === 'connected' || event.event === 'disconnected') {
                // connected/disconnected don't expose issue number in REST,
                // so fall back to closing-keyword parsing below
              }
            }

            // Also check for closing keywords in PR body as a fallback
            const body = context.payload.pull_request.body || '';
            const closingPattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            for (const m of body.matchAll(closingPattern)) {
              linkedIssueNumbers.push(parseInt(m[1]));
            }

            const uniqueIssues = [...new Set(linkedIssueNumbers)];

            if (uniqueIssues.length === 0) {
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: prNumber,
                  labels: ['needs-issue'],
                });
              } catch (e) {
                core.warning(`Could not add needs-issue label: ${e.message}`);
              }
              core.setFailed(
                'No linked issue found. Use the Development sidebar to link an issue, or add "Fixes #123" to the PR description.'
              );
              return;
            }

            // Check that PR author is assigned to at least one linked issue
            let authorAssigned = false;
            for (const num of uniqueIssues) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner, repo, issue_number: num,
                });
                if (issue.pull_request) continue;
                if (issue.assignees.some(a => a.login === prAuthor)) {
                  authorAssigned = true;
                  break;
                }
              } catch (e) {
                // Issue not found or inaccessible, skip
              }
            }

            const BOT_MARKER = '<!-- auto-label-draft-notice -->';

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: prNumber,
              });
              for (const c of comments) {
                if (c.body.includes(BOT_MARKER)) {
                  await github.rest.issues.deleteComment({
                    owner, repo, comment_id: c.id,
                  });
                }
              }
            } catch (e) {
              core.warning(`Could not manage bot comments: ${e.message}`);
            }

            if (!authorAssigned) {
              const issueList = uniqueIssues.map(n => '#' + n).join(', ');
              try {
                if (!context.payload.pull_request.draft) {
                  await github.rest.pulls.update({
                    owner, repo, pull_number: prNumber, draft: true,
                  });
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber,
                  body: `${BOT_MARKER}\nThis PR was converted to draft because @${prAuthor} is not assigned to any of the linked issues (${issueList}). Assign yourself to the issue and mark this PR as ready for review.`,
                });
              } catch (e) {
                core.warning(`Could not convert PR to draft or add comment: ${e.message}`);
              }
              core.setFailed(
                `PR author @${prAuthor} is not assigned to any linked issues (${issueList}). Assign yourself to the issue first.`
              );
            }
